name: Build Executable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.11"
  ARTIFACT_NAME: yt-dlp-fe-windows
  PACKAGE_BASENAME: yt_dlp_fe-windows-x64

jobs:
  windows-build:
    name: Test, build, and smoke-test Windows bundle
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=src --cov-report=term-missing

      - name: Build portable Windows bundle
        run: python -m PyInstaller main.spec --noconfirm --clean

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $fakeBin = Join-Path $env:RUNNER_TEMP "dlpfe-fake-bin"
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null

          "@echo off`r`nexit /b 0`r`n" | Set-Content -Path (Join-Path $fakeBin "yt-dlp.cmd") -Encoding Ascii
          "@echo off`r`nexit /b 0`r`n" | Set-Content -Path (Join-Path $fakeBin "ffmpeg.cmd") -Encoding Ascii

          $env:PATH = "$fakeBin;$env:PATH"

          $exe = (Resolve-Path "dist/yt_dlp_fe/yt_dlp_fe.exe").Path
          $process = Start-Process -FilePath $exe -PassThru

          try {
              Start-Sleep -Seconds 8
              $process.Refresh()
              if ($process.HasExited) {
                  throw "Packaged executable exited during startup with code $($process.ExitCode)."
              }
          }
          finally {
              $process.Refresh()
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force
              }
          }

      - name: Package portable bundle
        shell: pwsh
        run: |
          $package = "dist/$env:PACKAGE_BASENAME.zip"
          if (Test-Path $package) {
              Remove-Item $package -Force
          }
          Compress-Archive -Path "dist/yt_dlp_fe/*" -DestinationPath $package -CompressionLevel Optimal

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.PACKAGE_BASENAME }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-11-real-smoke:
    name: Smoke-test source app with real tools on Windows 11
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and yt-dlp
        run: python -m pip install -r requirements.txt yt-dlp

      - name: Install FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              choco install ffmpeg --yes --no-progress
          }

      - name: Run real-dependency startup smoke test
        shell: pwsh
        run: ./scripts/smoke_test_windows.ps1 -RequireWindows11

  release-metadata:
    name: Resolve release metadata
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      changelog: ${{ steps.metadata.outputs.changelog }}

    steps:
      - name: Checkout release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate release metadata
        id: metadata
        shell: python
        run: |
          import os
          import re
          import subprocess

          stage = "alpha"
          reset_point = None
          ref = os.environ["GITHUB_REF"]

          git_cmd = ["git", "log", "--pretty=format:%h %s"]
          if reset_point:
              git_cmd.append(f"{reset_point}..HEAD")

          log_lines = subprocess.check_output(git_cmd, text=True).splitlines()
          fixes = 0
          feats = 0
          changelog_entries = []
          exclude = re.compile(r'^\w+\s+(docs|chore|style|refactor|test|ci)(\(.*?\))?:', re.IGNORECASE)

          for line in log_lines:
              if re.search(r'\bfix(?:\(.*?\))?:', line):
                  fixes += 1
              if re.search(r'\bfeat(?:\(.*?\))?:', line):
                  feats += 1
              if not exclude.search(line) and 'dlpfe-ci' not in line:
                  changelog_entries.append(f"- {line}")

          if ref.startswith("refs/tags/"):
              release_tag = os.environ["GITHUB_REF_NAME"]
              should_release = True
          else:
              patch = fixes % 12
              total_minor = (fixes // 12) + feats
              minor = total_minor % 12
              major = total_minor // 12
              suffix = f"-{stage}" if stage else ""
              release_tag = f"v{major}.{minor}.{patch}{suffix}"
              tag_exists = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{release_tag}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              should_release = not tag_exists

          is_prerelease = bool(re.search(r'-[0-9A-Za-z]', release_tag))
          changelog = "### What's Changed\n\n" + (
              "\n".join(changelog_entries)
              if changelog_entries
              else "Maintenance updates and minor fixes."
          )

          delimiter = "DLPFE_CHANGELOG_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={release_tag}\n")
              output.write(f"is_prerelease={'true' if is_prerelease else 'false'}\n")
              output.write(f"should_release={'true' if should_release else 'false'}\n")
              output.write(f"changelog<<{delimiter}\n{changelog}\n{delimiter}\n")

  release:
    name: Publish GitHub release
    needs: [windows-build, release-metadata]
    if: needs.release-metadata.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
          RELEASE_NOTES: ${{ needs.release-metadata.outputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail

          source_asset="release/${PACKAGE_BASENAME}.zip"
          release_asset="release/yt_dlp_fe-${RELEASE_TAG}-windows-x64.zip"
          mv "$source_asset" "$release_asset"
          printf '%s\n' "$RELEASE_NOTES" > CHANGELOG.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$release_asset" --clobber
              exit 0
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release create "$RELEASE_TAG" "$release_asset" \
                  --target "$GITHUB_SHA" \
                  --title "$RELEASE_TAG" \
                  --notes-file CHANGELOG.md \
                  --prerelease
          else
              gh release create "$RELEASE_TAG" "$release_asset" \
                  --target "$GITHUB_SHA" \
                  --title "$RELEASE_TAG" \
                  --notes-file CHANGELOG.md
          fi
