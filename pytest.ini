[pytest]
minversion = 8.0
testpaths = tests
python_files = *_test.py
pythonpath = src
addopts = -ra --strict-markers --strict-config --import-mode=importlib
timeout = 60
xfail_strict = true
qt_api = pyside6
markers =
    unit: isolated tests that neither spawn processes nor need a full window
    integration: tests that execute real subprocesses (fake or real binaries)
    gui: tests that instantiate Qt widgets (run headless via the offscreen platform)
